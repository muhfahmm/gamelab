<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencarian Film</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <header>
            <h1>Pencarian Film</h1>
            <p>Temukan film favoritmu dengan API film gratis. Cari berdasarkan judul lalu lihat detail dan rating.</p>
        </header>
        <section class="search-panel">
            <div class="search-box">
                <input id="searchInput" type="text" placeholder="Masukkan judul film" autocomplete="off">
                <button id="searchButton" type="button">Cari Film</button>
            </div>
            <div id="alertMessage" class="alert"></div>
        </section>
        <section id="resultSection" class="result-section">
            <div id="movieList" class="movie-list"></div>
        </section>
        <section id="movieDetail" class="movie-detail hidden"></section>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
